# NextLaunch Hub 一键部署：MySQL + 后端接口 + 前端静态站点
#
# 用法：
#   docker compose up -d --build      启动（首次会自动建库并导入初始化数据）
#   docker compose logs -f            查看日志
#   docker compose down               停止（保留数据库数据）
#   docker compose down -v            停止并删除数据库数据
#
# 密码和密钥没有默认值，必须写在项目根目录的 .env 里（复制 .env.example 改名，
# 或者直接跑 start/docker-unix.sh，它会自动生成一份随机密钥）。

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?请先在项目根目录的 .env 里设置 DB_PASSWORD}"
      MYSQL_DATABASE: ${DB_NAME:-nextlaunch_hub}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 只在数据卷为空时执行，schema.sql 建表、seed.sql 灌初始数据
      - ./server/sql:/docker-entrypoint-initdb.d:ro
    # 数据库只在内部网络可达，需要外部连接时再打开下面两行
    # ports:
    #   - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: "${DB_PASSWORD:?请先在项目根目录的 .env 里设置 DB_PASSWORD}"
      DB_NAME: ${DB_NAME:-nextlaunch_hub}
      DB_CONNECT_TIMEOUT_MS: 5000
      # 必须自己生成，至少 32 位。用仓库里的示例值等于没有签名密钥，任何人都能伪造登录态
      JWT_SECRET: "${JWT_SECRET:?请先在项目根目录的 .env 里设置 JWT_SECRET（至少 32 位随机串）}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # 首次初始化用：把演示密码换成这个密码，并禁用其他示例账号的登录
      INIT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 浏览器访问站点用的地址，换域名或换端口时要同步改，局域网访问要加上局域网地址
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # 走 HTTPS 时改成 true，否则登录 Cookie 带 Secure 标记会在 http 下失效
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 前面只有一层 Nginx，所以信任 1 跳。写 0 或不写会退化成「不信任任何代理」，
      # 导致所有请求都算成 Nginx 容器的 IP，限流会把整个团队算作同一个人
      TRUST_PROXY: ${TRUST_PROXY:-1}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    # 需要绕过 Nginx 直接调接口时再打开
    # ports:
    #   - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  mysql_data:
  api_uploads:
